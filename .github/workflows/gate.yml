name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Gate self-test (honest passes, cheats fail)
        run: python3 tests/run_gate_tests.py
      - name: Trust-boundary regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Re-gate every published result
        run: python3 -m harness verify-results
